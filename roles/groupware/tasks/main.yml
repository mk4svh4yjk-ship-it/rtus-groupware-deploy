- name: Create app directory
  ansible.builtin.file:
    path: "{{ groupware_dir }}"
    state: directory
    mode: "0750"

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ groupware_dir }}/docker-compose.yml"
    mode: "0640"
  notify: restart groupware

- name: Start groupware
  community.docker.docker_compose_v2:
    project_src: "{{ groupware_dir }}"
    state: present

- name: Wait for health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ groupware_http_port }}/health"
    status_code: 200
  register: hc
  retries: 10
  delay: 6
  until: hc.status == 200
